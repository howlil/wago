version: "3"

silent: true

tasks:
  default:
    desc: List available Wago tasks
    cmds:
      - task --list

  install:
    desc: Install workspace dependencies
    cmds:
      - pnpm install

  lint:
    desc: Check formatting and lint rules
    cmds:
      - pnpm check

  lint:fix:
    desc: Apply Biome formatting and safe fixes
    cmds:
      - pnpm check:fix

  dev:
    desc: Run gateway and dashboard development servers
    deps:
      - gateway:dev
      - dashboard:dev

  test:
    desc: Run gateway and dashboard tests in parallel
    deps:
      - gateway:test
      - dashboard:test

  build:
    desc: Build gateway and dashboard in parallel
    deps:
      - gateway:build
      - dashboard:build

  check:
    desc: Run the core pre-merge quality gate
    cmds:
      - task: lint
      - task: test
      - task: build

  gateway:dev:
    desc: Run the gateway in development mode
    cmds:
      - pnpm --filter @wago/gateway dev

  gateway:test:
    desc: Run gateway tests
    cmds:
      - pnpm --filter @wago/gateway test

  gateway:build:
    desc: Build the gateway
    cmds:
      - pnpm --filter @wago/gateway build

  dashboard:dev:
    desc: Run the dashboard development server
    cmds:
      - pnpm --filter @wago/dashboard dev

  dashboard:test:
    desc: Run dashboard tests
    cmds:
      - pnpm --filter @wago/dashboard test

  dashboard:build:
    desc: Build the dashboard
    cmds:
      - pnpm --filter @wago/dashboard build

  docs:dev:
    desc: Run the documentation site
    cmds:
      - pnpm --filter @wago/docs dev

  docs:build:
    desc: Build the documentation site
    cmds:
      - pnpm --filter @wago/docs build

  image:
    desc: Build the local production image
    cmds:
      - docker build -t wago:local .

  up:
    desc: Start Wago with Docker Compose
    cmds:
      - docker compose up -d

  down:
    desc: Stop Wago Docker Compose services
    cmds:
      - docker compose down

  logs:
    desc: Follow Wago container logs
    cmds:
      - docker compose logs -f wago
