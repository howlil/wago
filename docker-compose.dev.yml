services:
  wago-dev:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_KEY: ${API_KEY:-dev-only-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
