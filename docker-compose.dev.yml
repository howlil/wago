services:
  wago-dev:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      APP_ID: ${APP_ID:-wa-gateway-dev}
      DATA_DIR: /app/data
      AUTH_DIR: /app/data/auth
      API_KEY: ${API_KEY:-}
      ALLOW_WEB_BOOTSTRAP: ${ALLOW_WEB_BOOTSTRAP:-true}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      BODY_LIMIT: ${BODY_LIMIT:-32kb}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-62}
      WA_VERSION_MODE: ${WA_VERSION_MODE:-default}
      REQUEST_LOGGING: ${REQUEST_LOGGING:-true}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      FRONTEND_DIST: /app/public
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
