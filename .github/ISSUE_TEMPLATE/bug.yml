name: Bug Report
description: Report a reproducible Wago bug.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste auth files, QR payloads, API keys, cookies, full phone numbers, full JIDs, message text, or raw production logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: List the smallest steps that reproduce the issue.
      placeholder: |
        1. Start with ...
        2. Send request ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or Commit
      placeholder: v0.1.0 or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Docker/PaaS/OS, Node version if not Docker, reverse proxy if any.
  - type: textarea
    id: safe-logs
    attributes:
      label: Redacted Logs
      description: Paste only redacted logs. Mask phone/JID/message data.
