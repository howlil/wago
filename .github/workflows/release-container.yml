name: Release Container

on:
  push:
    branches: [main]
    paths:
      - "apps/gateway/**"
      - "!apps/gateway/**/*.test.ts"
      - "apps/dashboard/**"
      - "!apps/dashboard/**/*.test.ts"
      - "!apps/dashboard/**/*.test.tsx"
      - "!apps/dashboard/tests/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/release-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-container-main
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/howlil/wago-simple

jobs:
  publish:
    name: Publish GHCR amd64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,mode=max,scope=release-amd64
