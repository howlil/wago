name: Monorepo Migration Cleanup

on:
  push:
    branches:
      - refactor/monorepo-taskfile

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: false
          install: false

      - name: Regenerate root lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Migrate repository path references
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("README.md"),
              Path("CONTRIBUTING.md"),
              Path("SECURITY.md"),
              Path("AGENTS.md"),
              Path(".agent/README.md"),
              Path(".agent/PROJECT.md"),
              Path(".agent/STATE.md"),
              Path(".agent/ENGINEERING.md"),
              Path(".agent/OPERATIONS.md"),
              Path(".agent/DECISIONS.md"),
              Path(".github/PULL_REQUEST_TEMPLATE.md"),
          ]

          command_replacements = {
              "pnpm --dir backend dev": "task gateway:dev",
              "pnpm --dir backend test": "task gateway:test",
              "pnpm --dir backend build": "task gateway:build",
              "pnpm --dir frontend dev": "task dashboard:dev",
              "pnpm --dir frontend test": "task dashboard:test",
              "pnpm --dir frontend build": "task dashboard:build",
              "pnpm --dir docs dev": "task docs:dev",
              "pnpm --dir docs test": "task docs:test",
              "pnpm --dir docs build": "task docs:build",
              "pnpm test:core": "task core:test",
              "pnpm build:core": "task core:build",
              "pnpm test:docs": "task docs:test",
              "pnpm build:docs": "task docs:build",
              "pnpm check:fix": "task lint:fix",
              "pnpm check": "task lint",
              "pnpm test": "task test",
              "pnpm build": "task build",
          }

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              for old, new in command_replacements.items():
                  text = text.replace(old, new)
              text = text.replace(
                  "Requirements: Node.js 26 and pnpm 11.21.0.",
                  "Requirements: Node.js 26, pnpm 11.21.0, and Task.",
              )
              text = text.replace("frontend/DESIGN.md", "apps/dashboard/DESIGN.md")
              text = re.sub(r"(?<!/)backend/", "apps/gateway/", text)
              text = re.sub(r"(?<!/)frontend/", "apps/dashboard/", text)
              text = re.sub(r"(?<!/)docs/", "apps/docs/", text)
              path.write_text(text)
          PY

      - name: Commit migration output when changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml README.md CONTRIBUTING.md SECURITY.md AGENTS.md .agent .github/PULL_REQUEST_TEMPLATE.md
          git commit -m "chore: finish monorepo path migration"
          git push
