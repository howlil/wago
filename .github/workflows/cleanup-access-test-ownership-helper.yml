name: Cleanup access test ownership helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure
    paths:
      - .github/workflows/cleanup-access-test-ownership-helper.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify cleanup boundary RED
        run: |
          set +e
          pnpm --dir backend test -- src/architecture/cleanup-boundary.test.ts > /tmp/cleanup-red.log 2>&1
          status=$?
          set -e
          cat /tmp/cleanup-red.log
          test "$status" -ne 0
          grep -F 'api-key-rotation.test.ts should live with modules/access' /tmp/cleanup-red.log
          grep -F 'app.browser-session.test.ts should live with modules/access' /tmp/cleanup-red.log

      - name: Move Access integration tests to their module
        run: |
          git mv backend/src/api-key-rotation.test.ts backend/src/modules/access/api-key-rotation.test.ts
          git mv backend/src/app.browser-session.test.ts backend/src/modules/access/browser-session.test.ts
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "backend/src/modules/access/api-key-rotation.test.ts": [
                  ('from "./app.js"', 'from "../../app.js"'),
                  ('from "./config/index.js"', 'from "../../config/index.js"'),
                  ('from "./modules/access/api-key.js"', 'from "./api-key.js"'),
                  ('from "./modules/access/browser-session-store.js"', 'from "./browser-session-store.js"'),
              ],
              "backend/src/modules/access/browser-session.test.ts": [
                  ('from "./app.js"', 'from "../../app.js"'),
                  ('from "./config/index.js"', 'from "../../config/index.js"'),
                  ('from "./modules/access/api-key.js"', 'from "./api-key.js"'),
                  ('from "./modules/access/browser-session-store.js"', 'from "./browser-session-store.js"'),
              ],
          }

          for path, changes in replacements.items():
              file = Path(path)
              text = file.read_text()
              for old, new in changes:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected exactly one {old!r}, found {count}")
                  text = text.replace(old, new)
              file.write_text(text)
          PY

      - name: Verify cleanup GREEN
        run: |
          pnpm check:fix
          pnpm check
          pnpm test
          pnpm build

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test: colocate access integration coverage"
          git push origin HEAD:refactor/modular-monolith-structure
