name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    name: Check, Test, Build Core and Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build core apps
        run: pnpm build:core

      - name: Build documentation
        run: pnpm --dir docs build

  docker-smoke:
    name: Docker Build and Persistence Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t wago-simple:ci .

      - name: Resolve rollback baseline
        id: rollback
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" ]]; then
            echo "ref=$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout rollback baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.rollback.outputs.ref }}
          path: rollback-main

      - name: Build known-good rollback image
        run: docker build -t wago-simple:rollback-base rollback-main

      - name: Run container persistence and rollback smoke
        env:
          IMAGE: wago-simple:ci
          ROLLBACK_IMAGE: wago-simple:rollback-base
          SKIP_BUILD: "1"
          EXPECTED_MIGRATIONS: "[1,2,3,4,5,6]"
        run: bash scripts/smoke-container.sh

  arm64-docker-build:
    name: Native ARM64 Docker Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image natively on ARM64
        run: docker build -t wago-simple:arm64-ci .
