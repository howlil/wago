name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check, Test, Build Core and Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build core apps
        run: pnpm build

      - name: Build documentation
        run: pnpm run build:docs

  docker-build:
    name: Docker Build and Persistence Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t wago-simple:ci .

      - name: Checkout rollback baseline
        uses: actions/checkout@v7
        with:
          ref: main
          path: rollback-main

      - name: Build known-good rollback image
        run: docker build -t wago-simple:rollback-base rollback-main

      - name: Run container persistence and rollback smoke
        env:
          IMAGE: wago-simple:ci
          ROLLBACK_IMAGE: wago-simple:rollback-base
          SKIP_BUILD: "1"
        run: bash scripts/smoke-container.sh
