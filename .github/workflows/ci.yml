name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - ".devland/**"
      - "*.md"
      - "apps/docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - ".devland/**"
      - "*.md"
      - "apps/docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    name: Check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true
          install: false

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: task lint

      - name: Run core tests
        run: task core:test

      - name: Build core
        run: task core:build
