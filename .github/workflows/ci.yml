name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - ".devland/**"
      - "*.md"
      - "apps/docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm check

      - name: Test core
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @wago/gateway test &
          gateway_pid=$!
          pnpm --filter @wago/dashboard test &
          dashboard_pid=$!
          wait "$gateway_pid"
          wait "$dashboard_pid"

      - name: Build core
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @wago/gateway build &
          gateway_pid=$!
          pnpm --filter @wago/dashboard build &
          dashboard_pid=$!
          wait "$gateway_pid"
          wait "$dashboard_pid"
