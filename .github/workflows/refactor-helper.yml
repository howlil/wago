name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  extract-frontend-transport:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make root API use shared transport
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/api.ts')
          text = path.read_text()

          old_header = 'const API_BASE_URL = import.meta.env.VITE_API_BASE_URL ?? "";\nconst LEGACY_API_KEY_SESSION_STORAGE_KEY = "wago.apiKey";'
          new_header = 'import { requestJson, requestText } from "./shared/api/client.js";\n\nconst LEGACY_API_KEY_SESSION_STORAGE_KEY = "wago.apiKey";'
          if text.count(old_header) != 1:
              raise SystemExit(f'expected one root API header, found {text.count(old_header)}')
          text = text.replace(old_header, new_header)

          old_transport = '''async function requestJson<T>(path: string, init?: RequestInit): Promise<T> {
            const response = await fetch(`${API_BASE_URL}${path}`, {
              ...init,
              credentials: "include",
            });
            const contentType = response.headers.get("content-type") ?? "";
            const data = contentType.includes("application/json")
              ? ((await response.json()) as T)
              : ({
                  success: false,
                  error: "NON_JSON_RESPONSE",
                  message: await response.text(),
                } as T);

            if (!response.ok) {
              throw data;
            }

            return data;
          }

          async function requestText(path: string): Promise<string> {
            const response = await fetch(`${API_BASE_URL}${path}`, { credentials: "include" });

            if (!response.ok) {
              throw new Error(await response.text());
            }

            return response.text();
          }

          '''
          # Strip YAML indentation introduced above before matching source text.
          old_transport = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_transport.splitlines()) + '\n'
          if text.count(old_transport) != 1:
              raise SystemExit(f'expected one local transport block, found {text.count(old_transport)}')
          text = text.replace(old_transport, '')
          path.write_text(text)
          PY

      - name: Verify transport extraction
        run: |
          pnpm exec biome check --write frontend/src/api.ts frontend/src/shared/api/client.ts frontend/tests/shared-api-client.test.ts frontend/src/api.browser-session.test.ts
          pnpm check
          pnpm --dir frontend exec vitest run tests/shared-api-client.test.ts src/api.browser-session.test.ts
          pnpm --dir frontend build

      - name: Commit verified extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/api.ts
          git diff --cached --quiet && exit 0
          git commit -m "refactor: extract shared frontend HTTP transport"
          git push origin HEAD:refactor/modular-monolith-structure
