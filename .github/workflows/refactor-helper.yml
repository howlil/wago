name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  migrate-messages-policy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Move outbound policy into messages module
        run: |
          set -euo pipefail
          git mv backend/src/policy/outbound-policy.ts backend/src/modules/messages/outbound-policy.ts
          git mv backend/src/policy/outbound-policy-store.ts backend/src/modules/messages/outbound-policy-store.ts
          git mv backend/src/policy/outbound-policy.test.ts backend/src/modules/messages/outbound-policy.test.ts
          git mv backend/src/policy/outbound-policy-error.test.ts backend/src/modules/messages/outbound-policy-error.test.ts
          git mv backend/src/policy/outbound-policy-persistence.test.ts backend/src/modules/messages/outbound-policy-persistence.test.ts
          git mv backend/src/policy/outbound-policy-persistence-failure.test.ts backend/src/modules/messages/outbound-policy-persistence-failure.test.ts

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "backend/src/modules/messages/outbound-policy.ts": [
                  ('../errors/application-error.js', '../../errors/application-error.js', 1),
                  ('../infrastructure/database.js', '../../infrastructure/database.js', 1),
                  ('../infrastructure/logger.js', '../../infrastructure/logger.js', 1),
                  ('../modules/whatsapp/account-health.js', '../whatsapp/account-health.js', 1),
                  ('../recipients/store.js', '../../recipients/store.js', 1),
              ],
              "backend/src/modules/messages/outbound-policy-store.ts": [
                  ('../infrastructure/database.js', '../../infrastructure/database.js', 1),
              ],
              "backend/src/modules/messages/outbound-policy.test.ts": [
                  ('../errors/application-error.js', '../../errors/application-error.js', 1),
                  ('../recipients/store.js', '../../recipients/store.js', 1),
              ],
              "backend/src/modules/messages/outbound-policy-error.test.ts": [
                  ('../errors/application-error.js', '../../errors/application-error.js', 1),
              ],
              "backend/src/modules/messages/outbound-policy-persistence.test.ts": [
                  ('../recipients/store.js', '../../recipients/store.js', 1),
              ],
              "backend/src/modules/messages/outbound-policy-persistence-failure.test.ts": [
                  ('../infrastructure/database.js', '../../infrastructure/database.js', 1),
                  ('../recipients/store.js', '../../recipients/store.js', 1),
              ],
              "backend/src/modules/messages/routes.ts": [
                  ('../../policy/outbound-policy.js', './outbound-policy.js', 1),
              ],
              "backend/src/modules/whatsapp/sender.ts": [
                  ('../../policy/outbound-policy.js', '../messages/outbound-policy.js', 1),
              ],
              "backend/src/index.ts": [
                  ('./policy/outbound-policy.js', './modules/messages/outbound-policy.js', 1),
              ],
              "backend/src/infrastructure/persistence.ts": [
                  ('../policy/outbound-policy.js', '../modules/messages/outbound-policy.js', 1),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new, expected in changes:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{filename}: expected {expected} occurrence(s) of {old!r}, found {actual}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Format and verify migration
        run: |
          pnpm exec biome check --write backend/src/modules/messages backend/src/modules/whatsapp/sender.ts backend/src/index.ts backend/src/infrastructure/persistence.ts
          pnpm check
          pnpm --dir backend test
          pnpm --dir backend build

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src
          git diff --cached --quiet && exit 0
          git commit -m "refactor: move outbound policy into messages module"
          git push origin HEAD:refactor/modular-monolith-structure
