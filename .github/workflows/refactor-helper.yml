name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  migrate-messages-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Move message consumers to feature API
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "frontend/src/features/messages/MessageStatusCard.tsx": [
                  ('import { getMessageStatus, type MessageStatusResponse } from "../../api.js";', 'import { getMessageStatus, type MessageStatusResponse } from "./api.js";', 1),
              ],
              "frontend/src/features/messages/SendMessageCard.tsx": [
                  ('import type { WhatsAppStatus } from "../../api.js";', 'import type { WhatsAppStatus } from "../whatsapp/api.js";', 1),
              ],
              "frontend/src/features/messages/useMessageComposer.ts": [
                  ('import { allowRecipient, sendMessage, type WhatsAppStatus } from "../../api.js";', 'import { allowRecipient } from "../../api.js";\nimport type { WhatsAppStatus } from "../whatsapp/api.js";\nimport { sendMessage } from "./api.js";', 1),
              ],
              "frontend/src/App.test.tsx": [
                  ('import { allowRecipient, listActivity, sendMessage } from "./api.js";', 'import { allowRecipient, listActivity } from "./api.js";\nimport { sendMessage } from "./features/messages/api.js";', 1),
                  ('vi.mock("./features/whatsapp/api.js", () => ({', '''vi.mock("./features/messages/api.js", () => ({
            getMessageStatus: vi.fn(async () => ({
              success: true,
              id: "message-1",
              to: "6281234567890@s.whatsapp.net",
              status: "pending",
              updatedAt: "2026-08-10T00:00:00.000Z",
            })),
            sendMessage: vi.fn(),
          }));

          vi.mock("./features/whatsapp/api.js", () => ({''', 1),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new, expected in changes:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{filename}: expected {expected} occurrence(s) of {old!r}, found {actual}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Verify messages migration
        run: |
          pnpm exec biome check --write frontend/src/features/messages frontend/src/App.test.tsx frontend/tests/messages-api.test.ts
          pnpm check
          pnpm --dir frontend exec vitest run --environment jsdom tests/messages-api.test.ts src/App.test.tsx
          pnpm --dir frontend build

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/tests/messages-api.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "refactor: move messages API into feature"
          git push origin HEAD:refactor/modular-monolith-structure
