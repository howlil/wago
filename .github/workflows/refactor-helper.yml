name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  migrate-activity-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Move activity consumers to feature API
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "frontend/src/features/activity/ActivityEventList.tsx": [
                  ('from "../../api.js";', 'from "./api.js";', 1),
              ],
              "frontend/src/features/activity/useActivityLog.ts": [
                  ('from "../../api.js";', 'from "./api.js";', 1),
              ],
              "frontend/src/features/activity/AuditPage.test.tsx": [
                  ('import { listActivity } from "../../api.js";', 'import { listActivity } from "./api.js";', 1),
                  ('vi.mock("../../api.js", () => ({', 'vi.mock("./api.js", () => ({', 1),
              ],
              "frontend/src/App.test.tsx": [
                  ('import { listActivity } from "./api.js";', 'import { listActivity } from "./features/activity/api.js";', 1),
                  ('vi.mock("./features/gateway/api.js", () => ({', '''vi.mock("./features/activity/api.js", () => ({
            listActivity: vi.fn(async () => ({ success: true, events: [] })),
          }));

          vi.mock("./features/gateway/api.js", () => ({''', 1),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new, expected in changes:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{filename}: expected {expected} occurrence(s) of {old!r}, found {actual}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Verify activity migration
        run: |
          pnpm exec biome check --write frontend/src/features/activity frontend/src/App.test.tsx frontend/tests/activity-api.test.ts
          pnpm check
          pnpm --dir frontend exec vitest run --environment jsdom tests/activity-api.test.ts src/features/activity/AuditPage.test.tsx src/App.test.tsx
          pnpm --dir frontend build

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/tests/activity-api.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "refactor: move activity API into feature"
          git push origin HEAD:refactor/modular-monolith-structure
