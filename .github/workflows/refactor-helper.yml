name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  migrate-whatsapp-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Move WhatsApp consumers to feature API
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "frontend/src/features/dashboard/DashboardPage.tsx": [
                  ('import type { WhatsAppStatus } from "../../api.js";', 'import type { WhatsAppStatus } from "../whatsapp/api.js";', 1),
              ],
              "frontend/src/features/dashboard/OverviewCards.tsx": [
                  ('import type { AccountHealthSnapshot, AccountHealthUnavailableReason, WhatsAppStatus } from "../../api.js";', 'import type { AccountHealthSnapshot, AccountHealthUnavailableReason, WhatsAppStatus } from "../whatsapp/api.js";', 1),
              ],
              "frontend/src/features/dashboard/useDashboardController.ts": [
                  ('import { pairWhatsApp, rebindWhatsApp } from "../../api.js";', 'import { pairWhatsApp, rebindWhatsApp } from "../whatsapp/api.js";', 1),
              ],
              "frontend/src/features/dashboard/useDashboardSnapshot.ts": [
                  ('} from "../../api.js";', '} from "../whatsapp/api.js";', 1),
              ],
              "frontend/src/features/whatsapp/AccountHealthCard.tsx": [
                  ('import type { AccountHealthSnapshot, AccountHealthUnavailableReason } from "../../api.js";', 'import type { AccountHealthSnapshot, AccountHealthUnavailableReason } from "./api.js";', 1),
              ],
              "frontend/src/features/whatsapp/WhatsAppBindingCard.tsx": [
                  ('import type { WhatsAppBinding, WhatsAppStatus } from "../../api.js";', 'import type { WhatsAppBinding, WhatsAppStatus } from "./api.js";', 1),
              ],
              "frontend/src/App.test.tsx": [
                  ('import { allowRecipient, getCurrentQr, listActivity, pairWhatsApp, sendMessage } from "./api.js";', 'import { allowRecipient, listActivity, sendMessage } from "./api.js";', 1),
                  ('import { RebindSessionDialog } from "./features/whatsapp/RebindSessionDialog.js";', 'import { RebindSessionDialog } from "./features/whatsapp/RebindSessionDialog.js";\nimport { getCurrentQr, pairWhatsApp } from "./features/whatsapp/api.js";', 1),
                  ('vi.mock("./api.js", () => ({', '''vi.mock("./features/whatsapp/api.js", () => ({
            getCurrentQr: vi.fn(async () => ({ success: true, qr: null, status: "connected" })),
            getQrImageSvg: vi.fn(async () => "<svg />"),
            getWhatsAppStatus: vi.fn(async () => ({
              success: true,
              status: "connected",
              binding: {
                state: "bound",
                jid: "6281234567890@s.whatsapp.net",
                phone: "6281234567890",
                boundAt: "2026-08-10T00:00:00.000Z",
              },
              accountHealth: { availability: "available" },
            })),
            pairWhatsApp: vi.fn(async () => ({ success: true, message: "Pairing started", status: "qr" })),
            rebindWhatsApp: vi.fn(async () => ({ success: true, message: "Pairing started", status: "qr" })),
          }));

          vi.mock("./api.js", () => ({''', 1),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new, expected in changes:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{filename}: expected {expected} occurrence(s) of {old!r}, found {actual}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Verify WhatsApp migration
        run: |
          pnpm exec biome check --write frontend/src/features/whatsapp frontend/src/features/dashboard frontend/src/App.test.tsx frontend/tests/whatsapp-api.test.ts
          pnpm check
          pnpm --dir frontend exec vitest run --environment jsdom tests/whatsapp-api.test.ts src/App.test.tsx src/features/dashboard/status-semantics.test.tsx
          pnpm --dir frontend build

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/tests/whatsapp-api.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "refactor: move WhatsApp API into feature"
          git push origin HEAD:refactor/modular-monolith-structure
