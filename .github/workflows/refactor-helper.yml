name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  remove-root-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Remove obsolete root API compatibility surface
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/App.test.tsx')
          text = path.read_text()
          start = 'vi.mock("./api.js", () => ({'
          end = '}));\n\nbeforeEach(() => {'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit(f'unexpected root mock markers: start={text.count(start)} end={text.count(end)}')
          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)
          path.write_text(before + 'beforeEach(() => {' + after)
          PY
          rm frontend/src/api.browser-session.test.ts
          rm frontend/src/api.ts
      - name: Verify root API removal
        run: |
          pnpm exec biome check --write frontend/src/App.test.tsx frontend/architecture frontend/src/features frontend/src/shared frontend/tests
          pnpm check
          pnpm --dir frontend test
          pnpm --dir frontend build
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend
          git diff --cached --quiet && exit 0
          git commit -m "refactor: remove root frontend API facade"
          git push origin HEAD:refactor/modular-monolith-structure
