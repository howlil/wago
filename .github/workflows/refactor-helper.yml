name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  migrate-webhook-core:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Move webhook settings store and delivery core
        run: |
          set -euo pipefail
          mkdir -p backend/src/modules/webhooks
          git mv backend/src/webhooks/settings-store.ts backend/src/modules/webhooks/settings-store.ts
          git mv backend/src/webhooks/settings-store.test.ts backend/src/modules/webhooks/settings-store.test.ts
          git mv backend/src/webhooks/settings-runtime.ts backend/src/modules/webhooks/settings-runtime.ts
          git mv backend/src/webhooks/delivery-webhook-core.ts backend/src/modules/webhooks/delivery-webhook-core.ts
          git mv backend/src/webhooks/delivery-webhook-core.test.ts backend/src/modules/webhooks/delivery-webhook-core.test.ts
          git mv backend/src/webhooks/delivery-store.ts backend/src/modules/webhooks/delivery-store.ts
          git mv backend/src/webhooks/delivery-store.test.ts backend/src/modules/webhooks/delivery-store.test.ts

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "backend/src/modules/webhooks/settings-runtime.ts": [
                  ('../config/webhook-config.js', '../../config/webhook-config.js', 1),
                  ('../infrastructure/database.js', '../../infrastructure/database.js', 1),
              ],
              "backend/src/modules/webhooks/settings-store.test.ts": [
                  ('../infrastructure/database/migrations.js', '../../infrastructure/database/migrations.js', 1),
              ],
              "backend/src/modules/webhooks/delivery-store.ts": [
                  ('../infrastructure/database/transaction.js', '../../infrastructure/database/transaction.js', 1),
              ],
              "backend/src/modules/webhooks/delivery-store.test.ts": [
                  ('../infrastructure/database/migrations.js', '../../infrastructure/database/migrations.js', 1),
              ],
              "backend/src/modules/gateway/readiness.ts": [
                  ('../../webhooks/settings-runtime.js', '../webhooks/settings-runtime.js', 1),
              ],
              "backend/src/modules/gateway/readiness.test.ts": [
                  ('../../webhooks/settings-runtime.js', '../webhooks/settings-runtime.js', 1),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new, expected in changes:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{filename}: expected {expected} occurrence(s) of {old!r}, found {actual}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          cat > backend/src/webhooks/settings-store.ts <<'EOF'
          export * from "../modules/webhooks/settings-store.js";
          EOF
          cat > backend/src/webhooks/settings-runtime.ts <<'EOF'
          export * from "../modules/webhooks/settings-runtime.js";
          EOF
          cat > backend/src/webhooks/delivery-webhook-core.ts <<'EOF'
          export * from "../modules/webhooks/delivery-webhook-core.js";
          EOF
          cat > backend/src/webhooks/delivery-store.ts <<'EOF'
          export * from "../modules/webhooks/delivery-store.js";
          EOF

      - name: Verify focused behavior
        run: |
          pnpm exec biome check --write backend/src/modules/webhooks backend/src/webhooks backend/src/modules/gateway/readiness.ts backend/src/modules/gateway/readiness.test.ts
          pnpm check
          pnpm --dir backend exec vitest run \
            src/modules/webhooks/settings-store.test.ts \
            src/modules/webhooks/delivery-webhook-core.test.ts \
            src/modules/webhooks/delivery-store.test.ts \
            src/webhooks/delivery-worker.test.ts \
            src/routes/webhook.routes.test.ts \
            src/modules/gateway/readiness.test.ts
          pnpm --dir backend build

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src
          git diff --cached --quiet && exit 0
          git commit -m "refactor: move webhook core into module"
          git push origin HEAD:refactor/modular-monolith-structure
