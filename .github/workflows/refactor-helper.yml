name: Refactor Helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rewrite-whatsapp-imports:
    if: github.event.pull_request.head.ref == 'refactor/modular-monolith-structure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rewrite legacy WhatsApp imports
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('backend/src/modules/whatsapp/lifecycle.ts'): {
                  '../../whatsapp/account-health.js': './account-health.js',
                  '../../whatsapp/binding-store.js': './binding-store.js',
                  '../../whatsapp/connection-state.js': './connection-state.js',
                  '../../whatsapp/credential-persistence-health.js': './credential-persistence-health.js',
                  '../../whatsapp/disconnect-classifier.js': './disconnect-classifier.js',
                  '../../whatsapp/message-rejection.js': './message-rejection.js',
                  '../../whatsapp/message-status-store.js': './message-status-store.js',
                  '../../whatsapp/recent-message-store.js': './recent-message-store.js',
                  '../../whatsapp/reconnect-state.js': './reconnect-state.js',
                  '../../whatsapp/wa-version.js': './wa-version.js',
              },
              Path('backend/src/policy/outbound-policy.ts'): {
                  '../whatsapp/account-health.js': '../modules/whatsapp/account-health.js',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text()
              for old, new in mapping.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Verify focused refactor gates
        run: |
          pnpm check
          pnpm --dir backend test -- src/modules/whatsapp src/policy/outbound-policy.test.ts
          pnpm --dir backend run build

      - name: Commit verified import rewrite
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add backend/src/modules/whatsapp/lifecycle.ts backend/src/policy/outbound-policy.ts
          if git diff --cached --quiet; then
            echo "No import rewrite required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: use canonical WhatsApp module imports"
          git push origin "HEAD:${HEAD_REF}"
