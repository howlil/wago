name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  migrate-recipients:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Move recipients domain into module
        run: |
          set -euo pipefail
          mkdir -p backend/src/modules/recipients
          git mv backend/src/recipients/store.ts backend/src/modules/recipients/store.ts
          git mv backend/src/recipients/store.test.ts backend/src/modules/recipients/store.test.ts
          git mv backend/src/routes/recipient.routes.ts backend/src/modules/recipients/routes.ts

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "backend/src/modules/recipients/store.ts": [
                  ('../infrastructure/database.js', '../../infrastructure/database.js', 1),
                  ('../utils/phone.js', '../../utils/phone.js', 1),
              ],
              "backend/src/modules/recipients/routes.ts": [
                  ('../http/middleware/async-handler.js', '../../http/middleware/async-handler.js', 1),
                  ('../http/middleware/auth.js', '../../http/middleware/auth.js', 1),
                  ('../modules/activity/store.js', '../activity/store.js', 1),
                  ('../recipients/store.js', './store.js', 1),
              ],
              "backend/src/app.ts": [
                  ('./routes/recipient.routes.js', './modules/recipients/routes.js', 1),
              ],
              "backend/src/app.test.ts": [
                  ('./recipients/store.js', './modules/recipients/store.js', 1),
              ],
              "backend/src/infrastructure/persistence.ts": [
                  ('../recipients/store.js', '../modules/recipients/store.js', 1),
              ],
              "backend/src/modules/messages/outbound-policy.ts": [
                  ('../../recipients/store.js', '../recipients/store.js', 1),
              ],
              "backend/src/modules/messages/outbound-policy.test.ts": [
                  ('../../recipients/store.js', '../recipients/store.js', 1),
              ],
              "backend/src/modules/messages/outbound-policy-persistence.test.ts": [
                  ('../../recipients/store.js', '../recipients/store.js', 1),
              ],
              "backend/src/modules/messages/outbound-policy-persistence-failure.test.ts": [
                  ('../../recipients/store.js', '../recipients/store.js', 1),
              ],
              "backend/src/modules/whatsapp/recipient-cache.ts": [
                  ('../../recipients/store.js', '../recipients/store.js', 1),
              ],
              "backend/src/modules/whatsapp/whatsapp.test.ts": [
                  ('../../recipients/store.js', '../recipients/store.js', 3),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new, expected in changes:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{filename}: expected {expected} occurrence(s) of {old!r}, found {actual}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          rmdir backend/src/recipients

      - name: Verify complete recipients ownership
        run: |
          pnpm exec biome check --write backend/src/modules/recipients backend/src/modules/messages backend/src/modules/whatsapp backend/src/app.ts backend/src/app.test.ts backend/src/infrastructure/persistence.ts
          pnpm check
          pnpm --dir backend test
          pnpm --dir backend build

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend/src
          git diff --cached --quiet && exit 0
          git commit -m "refactor: consolidate recipients module"
          git push origin HEAD:refactor/modular-monolith-structure
