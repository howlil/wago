name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  integrate-readiness:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Integrate readiness into dashboard snapshot scheduler
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          snapshot = Path('frontend/src/features/dashboard/useDashboardSnapshot.ts')
          text = snapshot.read_text()
          replacements = [
              (
                  'import { type AppInfoResponse, type BootstrapAppResponse, getAppInfo, getHealth } from "../gateway/api.js";',
                  '''import {
            type AppInfoResponse,
            type BootstrapAppResponse,
            type GatewayReadinessSnapshot,
            getAppInfo,
            getHealth,
            getReadiness,
          } from "../gateway/api.js";''',
              ),
              (
                  '  const [health, setHealth] = useState<BackendHealthState>("checking");',
                  '  const [health, setHealth] = useState<BackendHealthState>("checking");\n  const [readiness, setReadiness] = useState<GatewayReadinessSnapshot | null>(null);',
              ),
              (
                  '''        let info: Awaited<ReturnType<typeof loadAppInfo>>;''',
                  '''        try {
            setReadiness(await getReadiness());
          } catch {
            setReadiness(null);
          }

          let info: Awaited<ReturnType<typeof loadAppInfo>>;''',
              ),
              (
                  '''  return {
            health,''',
                  '''  return {
            health,
            readiness,''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'useDashboardSnapshot: expected one occurrence, found {count}: {old[:70]!r}')
              text = text.replace(old, new)
          snapshot.write_text(text)

          page = Path('frontend/src/features/dashboard/DashboardPage.tsx')
          text = page.read_text()
          old = '<OperationalReadinessBanner />'
          new = '<OperationalReadinessBanner readiness={dashboard.readiness} />'
          if text.count(old) != 1:
              raise SystemExit(f'DashboardPage: expected one readiness banner, found {text.count(old)}')
          page.write_text(text.replace(old, new))
          PY
      - name: Verify readiness scheduler consolidation
        run: |
          pnpm exec biome check --write frontend/src/features/dashboard frontend/src/features/gateway/api.ts frontend/src/shared/api/client.ts frontend/tests
          pnpm check
          pnpm --dir frontend exec vitest run --environment jsdom \
            tests/shared-api-client.test.ts \
            tests/operational-readiness-banner.test.tsx \
            tests/dashboard-readiness-snapshot.test.tsx \
            src/features/dashboard/readiness-state.test.ts \
            src/App.test.tsx
          pnpm --dir frontend build
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git diff --cached --quiet && exit 0
          git commit -m "refactor: consolidate dashboard readiness polling"
          git push origin HEAD:refactor/modular-monolith-structure
