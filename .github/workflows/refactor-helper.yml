name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  migrate-gateway-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Move gateway consumers to feature API
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "frontend/src/features/gateway/GatewayCredentialsCard.tsx": [
                  ('import type { AppInfoResponse } from "../../api.js";', 'import type { AppInfoResponse } from "./api.js";', 1),
              ],
              "frontend/src/features/dashboard/useDashboardController.ts": [
                  ('''import {
            bootstrapApp,
            createApiKeyCandidate,
            createBrowserSession,
            logoutAllBrowserSessions,
            logoutBrowserSession,
            pairWhatsApp,
            rebindWhatsApp,
            rotateApiKey,
          } from "../../api.js";''', '''import { pairWhatsApp, rebindWhatsApp } from "../../api.js";
          import {
            bootstrapApp,
            createApiKeyCandidate,
            createBrowserSession,
            logoutAllBrowserSessions,
            logoutBrowserSession,
            rotateApiKey,
          } from "../gateway/api.js";''', 1),
              ],
              "frontend/src/features/dashboard/useDashboardSnapshot.ts": [
                  ('''import {
            type AccountHealthSnapshot,
            type AppInfoResponse,
            type BootstrapAppResponse,
            getAppInfo,
            getCurrentQr,
            getHealth,
            getQrImageSvg,
            getWhatsAppStatus,
            type WhatsAppBinding,
            type WhatsAppStatus,
          } from "../../api.js";''', '''import {
            type AccountHealthSnapshot,
            getCurrentQr,
            getQrImageSvg,
            getWhatsAppStatus,
            type WhatsAppBinding,
            type WhatsAppStatus,
          } from "../../api.js";
          import { type AppInfoResponse, type BootstrapAppResponse, getAppInfo, getHealth } from "../gateway/api.js";''', 1),
              ],
              "frontend/src/App.test.tsx": [
                  ('''import {
            allowRecipient,
            bootstrapApp,
            createApiKeyCandidate,
            createBrowserSession,
            getAppInfo,
            getCurrentQr,
            getHealth,
            listActivity,
            logoutBrowserSession,
            pairWhatsApp,
            rotateApiKey,
            sendMessage,
          } from "./api.js";''', '''import { allowRecipient, getCurrentQr, listActivity, pairWhatsApp, sendMessage } from "./api.js";
          import {
            bootstrapApp,
            createApiKeyCandidate,
            createBrowserSession,
            getAppInfo,
            getHealth,
            logoutBrowserSession,
            rotateApiKey,
          } from "./features/gateway/api.js";''', 1),
                  ('const rotatedApiKey = `wa_${"d".repeat(43)}`;\n\nvi.mock("./api.js", () => ({', '''const rotatedApiKey = `wa_${"d".repeat(43)}`;

          vi.mock("./features/gateway/api.js", () => ({
            getAppInfo: vi.fn(async () => ({
              success: true,
              appId: "wa-gateway-test",
              apiKeyRequired: true,
              apiKeyConfigured: true,
              apiKeySource: "generated",
              authenticated: true,
              credentialSetupRequired: false,
              setupRequired: false,
            })),
            bootstrapApp: vi.fn(async (candidate: string) => ({
              success: true,
              appId: "wa-gateway-test",
              apiKey: candidate,
              recovered: false,
              sessionExpiresAt: "2026-09-12T00:00:00.000Z",
              message: "App initialized",
            })),
            createApiKeyCandidate: vi.fn(() => generatedApiKey),
            createBrowserSession: vi.fn(async () => ({
              success: true,
              authenticated: true,
              expiresAt: "2026-09-12T00:00:00.000Z",
              message: "Browser session created",
            })),
            getHealth: vi.fn(async () => ({ status: "ok" })),
            logoutBrowserSession: vi.fn(async () => ({
              success: true,
              authenticated: false,
              message: "Browser session ended",
            })),
            logoutAllBrowserSessions: vi.fn(async () => ({
              success: true,
              authenticated: false,
              message: "All browser sessions ended",
            })),
            rotateApiKey: vi.fn(async () => ({
              success: true,
              apiKey: rotatedApiKey,
              generatedAt: "2026-08-14T00:00:00.000Z",
              message: "API key rotated",
            })),
          }));

          vi.mock("./api.js", () => ({''', 1),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new, expected in changes:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{filename}: expected {expected} occurrence(s), found {actual}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Verify gateway migration
        run: |
          pnpm exec biome check --write frontend/src/features/gateway frontend/src/features/dashboard/useDashboardController.ts frontend/src/features/dashboard/useDashboardSnapshot.ts frontend/src/App.test.tsx frontend/tests/gateway-api.test.ts
          pnpm check
          pnpm --dir frontend exec vitest run --environment jsdom tests/gateway-api.test.ts src/App.test.tsx src/features/gateway/ApiKeyRotation.test.tsx
          pnpm --dir frontend build

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/tests/gateway-api.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "refactor: move gateway API into feature"
          git push origin HEAD:refactor/modular-monolith-structure
