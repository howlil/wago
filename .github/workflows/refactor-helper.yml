name: Refactor Helper

on:
  push:
    branches:
      - refactor/modular-monolith-structure

permissions:
  contents: write

jobs:
  verify-frontend-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/modular-monolith-structure
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Format and verify frontend refactor
        run: |
          set -euo pipefail
          pnpm exec biome check --write frontend/src frontend/tests frontend/architecture
          pnpm check
          pnpm --dir frontend test
          pnpm --dir frontend build
      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git diff --cached --quiet && exit 0
          git commit -m "style: format frontend refactor"
          git push origin HEAD:refactor/modular-monolith-structure
