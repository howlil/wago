name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "Taskfile.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "Taskfile.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs-ci.yml"

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Test and Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@26
          cache: true

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run docs tests
        run: task docs:test

      - name: Build docs
        run: task docs:build

      - name: Smoke standalone static build
        shell: bash
        run: |
          standalone_dir="$(mktemp -d)"
          cp -R apps/docs/. "$standalone_dir/"
          test ! -f "$standalone_dir/pnpm-lock.yaml"
          docker run --rm \
            --env CI=true \
            --volume "$standalone_dir:/workspace" \
            --workdir /workspace \
            node:22-alpine \
            sh -ec 'corepack enable && corepack prepare pnpm@11.21.0 --activate && pnpm install && pnpm build'
