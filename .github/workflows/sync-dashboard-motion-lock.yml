name: Sync dashboard Motion lockfile

on:
  push:
    branches:
      - feat/dashboard-surface-motion

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Resolve lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: sync dashboard Motion lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
