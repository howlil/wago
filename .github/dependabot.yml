version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jakarta
    allow:
      - dependency-name: "@biomejs/biome"
    groups:
      root-tooling:
        patterns:
          - "@biomejs/*"
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /apps/gateway
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Jakarta
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /apps/dashboard
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Jakarta
    groups:
      dashboard-react:
        patterns:
          - react
          - react-dom
          - "@types/react*"
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Jakarta
    groups:
      docs-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Jakarta
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:15"
      timezone: Asia/Jakarta
    commit-message:
      prefix: deps
