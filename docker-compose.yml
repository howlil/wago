services:
  wago:
    image: ghcr.io/howlil/wago-simple:latest
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env, for example https://wago.example.com}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - wago_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  wago_data:
